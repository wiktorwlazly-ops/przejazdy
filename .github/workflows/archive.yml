name: Archiwum tras (jednorazowo, z Transitland)
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Od kiedy (RRRR-MM-DD)"
        default: "2024-07-01"
      step_days:
        description: "Co ile dni brać wersję rozkładu (mniej = dokładniej, dłużej)"
        default: "7"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Pobierz dawne wersje GTFS i zbuduj archiwum przebiegów
        env:
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
        run: python3 tools/archive.py backfill --gql --since "${{ inputs.since }}" --step-days "${{ inputs.step_days }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          git add -A data/archive || true
          git diff --cached --quiet || git commit -m "Archiwum tras $(date -u +%F)"
          git pull --rebase && git push
