name: Aktualizacja GTFS (statyczny)
on:
  schedule:
    - cron: "17 1 * * *"     # codziennie ok. 03:17 czasu polskiego
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pobierz GTFS ZTP
        run: |
          mkdir -p /tmp/gtfs; ARGS=""
          for F in A T M; do
            if curl -fsSL --retry 3 -o /tmp/gtfs/$F.zip "https://gtfs.ztp.krakow.pl/GTFS_KRK_$F.zip"; then ARGS="$ARGS --zip $F=/tmp/gtfs/$F.zip"; fi
          done
          echo "ZIPS=$ARGS" >> "$GITHUB_ENV"
      - run: python3 tools/build_static.py --out data $ZIPS
      - name: Dopisz przebiegi do archiwum tras
        run: python3 tools/archive.py update $ZIPS
      - name: Commit
        run: |
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "GTFS $(date -u +%F)"
          git pull --rebase && git push
